<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Date, Time and Day | PHP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Patrick+Hand&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage" aria-live="polite">
    <h1>Right now</h1>
    <p class="day" id="day">Loading...</p>
    <p class="clock"><span id="time">--:--:--</span> <span class="ampm" id="meridiem">--</span></p>
    <p class="date" id="date">Fetching date from PHP</p>
    <p class="small">Server timezone: <span id="zone">--</span></p>
    <p class="small"><a href="age.html">Go to the age check</a></p>
    <p class="note" id="error" hidden>
      Could not reach api/datetime.php. Run this folder with a PHP server:
      <code>php -S localhost:8000</code>
    </p>
  </main>
  <script src="script.js"></script>
</body>
</html>
